<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient: Red-Orange -> Amber -> Cyan -> Royal Blue -> Indigo -->
    <linearGradient id="vyroRingGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF3815" />
      <stop offset="22%" stop-color="#FF8A00" />
      <stop offset="42%" stop-color="#FFB703" />
      <stop offset="55%" stop-color="#00D2FF" />
      <stop offset="78%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#2434D6" />
    </linearGradient>

    <!-- Orange Figure Gradient: Vibrant yellow-orange to deep warm red -->
    <linearGradient id="vyroOrangeGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="40%" stop-color="#FF8000" />
      <stop offset="78%" stop-color="#FF4000" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Blue Figure Gradient: Bright sky cyan to royal blue -->
    <linearGradient id="vyroBlueGrad" x1="80%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#00A2FF" />
      <stop offset="75%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Orange Head Gradient -->
    <linearGradient id="vyroOrangeHead" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- Blue Head Gradient -->
    <linearGradient id="vyroBlueHead" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- 3D Ribbon Shadow for the Handshake fold -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Clean Circular Background -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- Outer Gradient Ring -->
  <circle
    cx="250"
    cy="250"
    r="228"
    stroke="url(#vyroRingGrad)"
    stroke-width="14"
    fill="none"
    stroke-linecap="round"
  />

  <!-- Main Symbol Group -->
  <g id="vyro-interlocking-handshake" transform="translate(0, 0)">
    <!-- Left Figure Head (Orange) -->
    <circle cx="180" cy="162" r="35" fill="url(#vyroOrangeHead)" />

    <!-- Right Figure Head (Blue) -->
    <circle cx="320" cy="162" r="35" fill="url(#vyroBlueHead)" />

    <!-- Right Figure (Blue Ribbon Body & Arm) - Placed first to allow orange hand overlap -->
    <path
      d="M 334 202
         C 372 208 396 238 396 274
         C 396 322 355 362 294 362
         C 275 362 258 354 246 342
         C 238 334 228 322 222 312
         C 234 298 252 288 266 276
         C 276 268 288 256 295 244
         C 314 246 328 260 334 278
         C 338 290 332 305 320 314
         C 312 320 300 324 290 324
         C 276 324 266 318 258 310
         C 272 298 288 284 300 270
         C 312 256 318 244 322 232
         C 328 220 332 210 334 202 Z"
      fill="url(#vyroBlueGrad)"
    />

    <!-- Left Figure (Orange Ribbon Body & Arm) -->
    <path
      d="M 166 202
         C 128 208 104 238 104 274
         C 104 322 145 362 206 362
         C 225 362 242 354 254 342
         C 262 334 272 322 278 312
         C 266 298 248 288 234 276
         C 224 268 212 256 205 244
         C 186 246 172 260 166 278
         C 162 290 168 305 180 314
         C 188 320 200 324 210 324
         C 224 324 234 318 242 310
         C 228 298 212 284 200 270
         C 188 256 182 244 178 232
         C 172 220 168 210 166 202 Z"
      fill="url(#vyroOrangeGrad)"
    />

    <!-- Overlapping Clasp / Handshake Bridge (giving the 3D interlocking handshake look) -->
    <!-- Orange hand reaching into blue fold -->
    <path
      d="M 242 310
         C 254 298 268 284 282 272
         C 287 268 292 272 290 278
         C 282 292 270 306 256 318
         C 250 324 242 318 242 310 Z"
      fill="url(#vyroOrangeGrad)"
      filter="url(#ribbonShadow)"
    />

    <!-- Blue hand reaching into orange fold -->
    <path
      d="M 258 310
         C 246 298 232 284 218 272
         C 213 268 208 272 210 278
         C 218 292 230 306 244 318
         C 250 324 258 318 258 310 Z"
      fill="url(#vyroBlueGrad)"
      opacity="0.96"
    />

    <!-- Inner Clean Heart / Drop Negative Space -->
    <path
      d="M 250 248
         C 236 234 212 226 195 240
         C 182 252 182 272 198 288
         C 216 306 238 322 250 332
         C 262 322 284 306 302 288
         C 318 272 318 252 305 240
         C 288 226 264 234 250 248 Z"
      fill="#FFFFFF"
    />

    <!-- Handshake Heart Center Loop Detail -->
    <path
      d="M 250 256
         C 240 244 222 238 210 248
         C 200 257 202 270 214 282
         C 226 296 242 308 250 316
         C 258 308 274 296 286 282
         C 298 270 300 257 290 248
         C 278 238 260 244 250 256 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
